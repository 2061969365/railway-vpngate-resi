name: Unit tests

# The suite is timing sensitive (background probes, health loops, the 45s
# warm-up grace), so every push runs it several times per interpreter: a
# green run that only holds once is not green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        repeat: [1, 2, 3]
    name: pytest ${{ matrix.python-version }} run ${{ matrix.repeat }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run the test suite
        run: python -m pytest tests -q -rs
