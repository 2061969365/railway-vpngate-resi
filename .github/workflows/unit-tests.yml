name: Unit tests

# The suite is timing sensitive (background probes, health loops, the 45s
# warm-up grace), so every push runs it several times per interpreter: a
# green run that only holds once is not green.
#
# The second job checks a generated config with the REAL sing-box: the unit
# tests only see the config as a dict, so a field sing-box does not know
# (a typo like "auth-retry" instead of "auth_retry") passes every test and
# then makes the manager refuse to start in production.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        repeat: [1, 2, 3]
    name: pytest ${{ matrix.python-version }} run ${{ matrix.repeat }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run the test suite
        run: python -m pytest tests -q -rs -p no:cacheprovider
      - name: The suite must not leave files behind
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the test run polluted the working tree:"
            git status --porcelain
            exit 1
          fi

  # R2-4-19: PRs build the real image and smoke-test the entrypoint.  Without
  # this, "unit tests green, image dead" regressions only surface after a
  # main push has already published the image.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: docker build + entrypoint smoke
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image (no push)
        run: docker build --platform linux/amd64 -t railway-vpngate:pr .
      - name: Smoke test image entrypoint
        run: |
          docker run --rm --entrypoint /bin/sh railway-vpngate:pr -c \
            'bash -n /app/start.sh && sh -n /app/entrypoint.sh && cd /app && python3 -c "import railway_manager, vpngate_to_singbox"'
          test "$(docker run --rm -e ENTRYPOINT_DRY_RUN=1 railway-vpngate:pr)" = "10001"

  singbox-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: sing-box accepts a generated config
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install sing-box ${{ env.SINGBOX_VERSION }}
        env:
          # The SAME version the image ships (Dockerfile ARG SINGBOX_VERSION):
          # a config the deployed binary would reject must fail the push.
          SINGBOX_VERSION: "1.15.0-alpha.12"
          SINGBOX_SHA256: "b107528ec7d989333d986573c097d840b9ef1afa9bb177f8eb03e0767f370514"
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$SINGBOX_SHA256" /tmp/sing-box.tar.gz | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 755 "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version
      - name: Build a rotate config and let sing-box check it
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "tests")
          from test_vpngate_to_singbox import TCP_OVPN
          from vpngate_to_singbox import (_dial_probe_config,
                                          build_singbox_config,
                                          ovpn_to_endpoint)
          ep = ovpn_to_endpoint(TCP_OVPN, tag="vpngate-0")
          cfg = build_singbox_config(
              [ep], "127.0.0.1", 40000, mixed_users=[("u", "p")],
              final="auto", preferred="vpngate-0", backup=None,
              vless_uuid="u-u-i-d", vless_direct_port=8080,
              vless_chain_port=8082, resi=None, resi_port=5180,
              resi_path="/ws-resi", resi_rotate=True,
              resi_rotate_tags=["vpngate-0"])
          with open("/tmp/rotate.json", "w", encoding="utf-8") as handle:
              json.dump(cfg, handle, indent=2)
          # The throwaway probe config is a second config sing-box has to
          # accept: it is what every real dial and every exit-IP verify
          # starts, and a field sing-box rejects there kills the measurement
          # path silently.
          probe = _dial_probe_config(ep, 40001)
          with open("/tmp/probe.json", "w", encoding="utf-8") as handle:
              json.dump(probe, handle, indent=2)
          print("serving endpoints:", [e["tag"] for e in cfg["endpoints"]])
          print("probe endpoints:", [e["tag"] for e in probe["endpoints"]])
          PY
          sing-box check -c /tmp/rotate.json
          sing-box check -c /tmp/probe.json
