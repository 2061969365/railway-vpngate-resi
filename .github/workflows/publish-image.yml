name: Publish image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize publishes per ref: two overlapping builds must not race to push
# `latest`, and an older commit must never overwrite a newer one (R2-4-02).
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the test job only needs read; the publish job adds
# package write permission at job level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run Python tests
        run: python -m pytest tests -q -p no:cacheprovider
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27"
      - name: Run Go tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Log in to GHCR
        # docker/login-action v3
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tags
        id: meta
        # docker/metadata-action v5
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
      - name: Build image for smoke test
        # docker/build-push-action v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: railway-vpngate:smoke
      - name: Smoke test image entrypoint
        # No push happens until the image proves it can import the manager and
        # drop to UID 10001 (R2-4-09/R2-4-16).
        run: |
          docker run --rm --entrypoint /bin/sh railway-vpngate:smoke -c \
            'bash -n /app/start.sh && sh -n /app/entrypoint.sh && cd /app && python3 -c "import railway_manager, vpngate_to_singbox"'
          test "$(docker run --rm -e ENTRYPOINT_DRY_RUN=1 railway-vpngate:smoke)" = "10001"
      - name: Build and push
        # docker/build-push-action v6
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
