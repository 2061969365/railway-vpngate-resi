name: Chain hot-switch acceptance

# Temporary cloud acceptance test for docs/rotate-design.md §12.9g (D15):
#   * the rotate "chain" group is a selector over every serving tag with the
#     Clash API on loopback, so a repin is PUT /proxies/chain;
#   * killing the pin must move the chain to a live node with NO config
#     rewrite, NO sing-box restart and NO dropped rotation connections;
#   * exactly one node stays reserved, so /ws-resi keeps its pool.
# Delete this file once verified.

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIMIT: "16"
  REAL_TOPK: "10"
  ADMIN_TOKEN: rotate-admin-token-0123456789
  TEST_UUID: a29738e5-bee1-c0fc-b484-ae7c49cbc828
  SINGBOX_VERSION: 1.14.0

jobs:
  chain-hotswitch:
    name: Chain repins through the Clash API without a restart
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: rotate-trial:trial
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container (NET_ADMIN so the test can kill node IPs)
        run: |
          docker run -d --name rotate-trial \
            --cap-add=NET_ADMIN \
            -p 3000:3000 \
            -e PORT=3000 \
            -e PROXY_USER=u -e PROXY_PASS=0123456789abcdef \
            -e ADMIN_TOKEN="$ADMIN_TOKEN" \
            -e VLESS_UUID="$TEST_UUID" \
            -e LIMIT="$LIMIT" -e REAL_TOPK="$REAL_TOPK" \
            -e DIAL_WORKERS=5 -e FULL_PROBE_WORKERS=5 -e PROBE_WORKERS=30 \
            -e DIAL_TIMEOUT=8 \
            rotate-trial:trial
          for i in $(seq 1 40); do
            if curl -m 5 -s http://127.0.0.1:3000/healthz | grep -q "^ok$"; then
              echo "healthz OK after ~$((i * 10))s"
              break
            fi
            sleep 10
          done
          curl -m 10 -s http://127.0.0.1:3000/healthz | grep -q "^ok$" || {
            docker logs rotate-trial 2>&1 | tail -n 60; exit 1; }

      - name: Wait for a verified pool and a pinned chain
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          for i in $(seq 1 150); do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status.json
            if python3 -c "import json;s=json.load(open('/tmp/status.json'));exit(0 if s['resi']['pool']>=4 and s['full_probe']['state']=='done' and s.get('preferred_tag') else 1)"; then
              break
            fi
            sleep 5
          done
          python3 - <<'EOF'
          import json
          s = json.load(open("/tmp/status.json"))
          r = s["resi"]
          print(f"pool={r['pool']} inbounds={r.get('inbounds')} serving={len(s['endpoints'])} "
                f"down={r.get('down')} reserved={r.get('reserved')} "
                f"pin={s.get('preferred_tag')} backup={s.get('backup_tag')}")
          assert r["mode"] == "rotate", r
          assert r["pool"] >= 4, r
          assert s.get("preferred_tag"), s
          print("POOL OK: verified rotation pool with a pinned chain")
          EOF
          # The initial refresh can still be republishing (auto-pin writes the
          # config and restarts sing-box). A pid/md5 baseline taken while that
          # is in flight blames the failover for a restart it did not do: wait
          # until the process and the config are quiet - no rewrite in the last
          # 60 seconds, same pid+md5 across two samples.
          prev=""
          for i in $(seq 1 60); do
            pid=$(docker exec rotate-trial sh -c 'for p in /proc/[0-9]*/cmdline; do c=$(tr "\0" " " < "$p" 2>/dev/null); case "$c" in *sing-box*run*/app/singbox-railway.json*) echo "$p" | cut -d/ -f3; break;; esac; done')
            md5=$(docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1')
            recent=$(docker logs --since 60s rotate-trial 2>&1 | grep -c "config rewritten" || true)
            cur="$pid/$md5"
            echo "settle $i: pid=$pid md5=$md5 rewrites_in_last_60s=$recent"
            if [ "$cur" = "$prev" ] && [ "$recent" = "0" ]; then
              echo "SETTLED: pin and sing-box are quiet"
              break
            fi
            prev="$cur"
            sleep 10
          done
          [ "$recent" = "0" ] || { echo "config never settled"; exit 1; }


      - name: The chain is a selector over the whole serving set
        run: |
          docker exec rotate-trial cat /app/singbox-railway.json > /tmp/cfg.json
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/status -o /tmp/status.json
          python3 - <<'EOF'
          import json
          cfg = json.load(open("/tmp/cfg.json"))
          s = json.load(open("/tmp/status.json"))
          api = (cfg.get("experimental") or {}).get("clash_api") or {}
          chain = next(o for o in cfg["outbounds"] if o["tag"] == "chain")
          serving = {ep["tag"] for ep in cfg["endpoints"]}
          print("clash_api:", api.get("external_controller"),
                "chain:", chain["type"], len(chain["outbounds"]), "candidates",
                "default:", chain["default"], "pin:", s.get("preferred_tag"),
                "reserved:", s["resi"]["reserved"], "switch:", s["chain_switch"])
          assert api.get("external_controller", "").startswith("127.0.0.1:"), api
          assert api.get("secret"), api
          assert chain["type"] == "selector", chain
          assert chain["default"] == s["preferred_tag"], (chain, s["preferred_tag"])
          assert chain["interrupt_exist_connections"] is False, chain
          assert set(chain["outbounds"]) == serving, (chain["outbounds"], serving)
          assert "auto" not in chain["outbounds"], chain
          # One reserved node, not two: the rotation keeps the rest of the pool.
          assert s["resi"]["reserved"] == 1, s["resi"]
          assert s["chain_switch"]["mode"] == "clash", s["chain_switch"]
          print("CHAIN GROUP OK: selector over", len(serving),
                "serving tags, single reservation")
          EOF
      - name: Start one quick tunnel to :3000
        run: |
          curl -Ls https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:3000 --no-autoupdate \
            > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            HOST=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log | head -n1 || true)
            if [ -n "$HOST" ]; then
              echo "$HOST" | sed 's#https://##' > /tmp/host.txt
              echo "tunnel host: $(cat /tmp/host.txt)"
              exit 0
            fi
            sleep 2
          done
          tail -n 40 /tmp/tunnel.log; exit 1

      - name: Real clients on all three paths (baseline)
        run: |
          if [ ! -f /tmp/sing-box-tarball.tgz ]; then
            curl -Ls "https://github.com/SagerNet/sing-box/releases/download/v${{ env.SINGBOX_VERSION }}/sing-box-${{ env.SINGBOX_VERSION }}-linux-amd64.tar.gz" -o /tmp/sing-box-tarball.tgz
          fi
          tar xzf /tmp/sing-box-tarball.tgz
          SB=$(ls -d ./sing-box-*/sing-box | head -n1)
          HOST=$(cat /tmp/host.txt)
          DIRECT_IP=$(curl -m 20 -s https://api.ipify.org)
          echo "$DIRECT_IP" > /tmp/direct_ip.txt
          echo "runner direct IP: $DIRECT_IP"
          python3 - "$HOST" "$TEST_UUID" <<'EOF'
          import json, sys
          host, uuid = sys.argv[1], sys.argv[2]
          for path, port in (("/ws-node", 18091), ("/ws-chain", 18092), ("/ws-resi", 18093)):
              cfg = {
                  "log": {"level": "warn"},
                  "inbounds": [{"type": "socks", "tag": "s", "listen": "127.0.0.1",
                                "listen_port": port}],
                  "outbounds": [{
                      "type": "vless", "tag": "v", "server": host,
                      "server_port": 443, "uuid": uuid,
                      "tls": {"enabled": True, "server_name": host},
                      "transport": {"type": "ws", "path": path, "headers": {"Host": host}},
                  }],
                  "route": {"final": "v", "auto_detect_interface": True},
              }
              name = path.strip("/").replace("-", "")
              json.dump(cfg, open(f"/tmp/client-{name}.json", "w"), indent=2)
          EOF
          for name in wsnode wschain wsresi; do
            "$SB" check -c "/tmp/client-${name}.json"
            "$SB" run -c "/tmp/client-${name}.json" > "/tmp/client-${name}.log" 2>&1 &
          done
          sleep 12
          ip_via() {
            local port="$1" url ip
            for url in https://api.ipify.org https://icanhazip.com https://ifconfig.me/ip; do
              ip=$(curl -m 30 -s -x "socks5h://127.0.0.1:${port}" "$url" || true)
              [ -n "$ip" ] && { echo "$ip"; return 0; }
            done
            echo ""
          }
          get_ip() {
            local port="$1"
            for i in $(seq 1 8); do
              ip=$(ip_via "$port")
              [ -n "$ip" ] && { echo "$ip"; return 0; }
              sleep 6
            done
            echo ""
          }
          echo "node exit=$(get_ip 18091)" >> /tmp/baseline.txt
          chain_ip=""
          for round in 1 2 3 4; do
            chain_ip=$(get_ip 18092)
            [ -n "$chain_ip" ] && break
            sleep 15
          done
          echo "chain exit=${chain_ip}" >> /tmp/baseline.txt
          # Rotation health is advisory here: this run is about the chain, and
          # the quick tunnel/socks client can be flaky. Its *pool* is checked
          # through /api/status instead of requiring two distinct exit IPs.
          : > /tmp/resi-ips.txt
          for i in $(seq 1 6); do
            ip=$(ip_via 18093)
            [ -n "$ip" ] && echo "$ip" >> /tmp/resi-ips.txt
            sleep 2
          done
          cat /tmp/baseline.txt
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/status -o /tmp/status_baseline.json
          echo "resi ips=$(sort -u /tmp/resi-ips.txt | wc -l) distinct"
          python3 - <<'EOF'
          import json, pathlib
          lines = {}
          for line in pathlib.Path("/tmp/baseline.txt").read_text().splitlines():
              if " exit=" in line:
                  k, v = line.split(" exit=", 1)
                  lines[k.strip()] = v.strip()
          direct = pathlib.Path("/tmp/direct_ip.txt").read_text().strip()
          ips = [l.strip() for l in pathlib.Path("/tmp/resi-ips.txt").read_text().splitlines() if l.strip()]
          status = json.load(open("/tmp/status_baseline.json"))
          r = status["resi"]
          print("baseline:", lines, "direct:", direct, "resi:", ips,
                f"pool={r['pool']} down={r.get('down')}")
          assert lines.get("node") == direct, (lines, direct)
          assert lines.get("chain") and lines["chain"] != direct, lines
          assert r["mode"] == "rotate" and r["pool"] >= 1, r
          assert status.get("preferred_tag"), status
          print(f"BASELINE OK: node={direct} chain={lines['chain']} resi_pool={r['pool']}")
          EOF

      - name: Let the rotation carry real payload
        run: |
          # 20KB through the rotation: records "this node's tunnel works right
          # now" evidence (_resi_proven / _resi_payload_at), which the chain
          # rescue must prefer over stale latency numbers.
          for i in 1 2 3 4; do
            curl -m 60 -s -x socks5h://127.0.0.1:18093 \
              "https://speed.cloudflare.com/__down?bytes=20000" -o /tmp/resi-payload.bin || true
            echo "payload sample $i: $(wc -c < /tmp/resi-payload.bin 2>/dev/null || echo 0) bytes"
            sleep 1
          done
          test "$(wc -c < /tmp/resi-payload.bin)" -ge 1024 || {
            echo "WARN: the rotation carried no >1KB payload (quick tunnel flake);"
            echo "      the rescue will fall back to weaker evidence."; }

      - name: Kill the pin - the chain must hot-switch with no restart
        run: |
          docker exec -u 0 rotate-trial sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends iptables" >/tmp/apt.log 2>&1 || {
            tail -n 30 /tmp/apt.log; exit 1; }
          # Re-snapshot right before the kill: the baseline wait above may have
          # legitimately triggered a rescue (the initial pin can be a corpse).
          for i in $(seq 1 12); do
            recent=$(docker logs --since 60s rotate-trial 2>&1 | grep -c "config rewritten" || true)
            [ "$recent" = "0" ] && break
            echo "in-flight config rewrite, waiting before the baseline ($i)"
            sleep 10
          done
          [ "$recent" = "0" ] || { echo "config still being rewritten"; exit 1; }
          docker logs rotate-trial 2>&1 | grep -c "chain rescue:" > /tmp/rescues_at_baseline.txt || true
          docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1' > /tmp/cfg_before.txt
          docker exec rotate-trial sh -c 'for p in /proc/[0-9]*/cmdline; do c=$(tr "\0" " " < "$p" 2>/dev/null); case "$c" in *sing-box*run*/app/singbox-railway.json*) echo "$p" | cut -d/ -f3; break;; esac; done' > /tmp/sb_pid_before.txt
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/status -o /tmp/status_prekill.json
          docker exec rotate-trial cat /app/singbox-railway.json > /tmp/cfg.json
          python3 - <<'EOF'
          import json, pathlib
          s = json.load(open("/tmp/status_prekill.json"))
          pin = s.get("preferred_tag")
          print(f"pre-kill pin={pin} pool={s['resi']['pool']} "
                f"switches={s['chain_switch']['switches']} backup={s.get('backup_tag')}")
          assert pin, s
          pathlib.Path("/tmp/pin_before.txt").write_text(pin)
          pathlib.Path("/tmp/switches_before.txt").write_text(str(s["chain_switch"]["switches"]))
          pathlib.Path("/tmp/pool_before.txt").write_text(str(s["resi"]["pool"]))
          EOF
          python3 - <<'EOF'
          import json, pathlib, socket
          cfg = json.load(open("/tmp/cfg.json"))
          tag = pathlib.Path("/tmp/pin_before.txt").read_text().strip()
          endpoints = {ep.get("tag"): ep for ep in (cfg.get("endpoints") or [])}
          ep = endpoints[tag]

          def addrs_of(e):
              out = [e["server"]] if e.get("server") else []
              for item in e.get("servers") or []:
                  if isinstance(item, dict) and item.get("server"):
                      out.append(item["server"])
              return out

          def resolve(host):
              try:
                  return sorted({info[4][0] for info in socket.getaddrinfo(host, None)})
              except OSError:
                  return [host]

          lines = sorted({f"{ip} {tag}" for addr in addrs_of(ep) for ip in resolve(addr)})
          pathlib.Path("/tmp/pin_blocked.txt").write_text("\n".join(lines) + "\n")
          print(f"kill pin {tag}: {len(lines)} address(es)")
          for line in lines:
              print(f"  block {line.split()[1]} ({line.split()[0]})")
          assert lines, "pin has no address in the config"
          EOF
          docker exec -u 0 rotate-trial sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends iptables" >/tmp/apt.log 2>&1 || {
            tail -n 30 /tmp/apt.log; exit 1; }
          while read -r ip tag; do
            docker exec -u 0 rotate-trial iptables -A OUTPUT -p tcp -d "$ip" \
              -j REJECT --reject-with tcp-reset || true
            docker exec -u 0 rotate-trial iptables -A OUTPUT -p udp -d "$ip" -j REJECT || true
          done < /tmp/pin_blocked.txt
          docker exec -u 0 -i rotate-trial sh -c 'cat > /tmp/pin_blocked.txt' < /tmp/pin_blocked.txt
          docker exec -u 0 -i rotate-trial python3 - <<'EOF'
          import pathlib, socket
          bad = []
          for line in pathlib.Path("/tmp/pin_blocked.txt").read_text().splitlines():
              if not line.strip():
                  continue
              ip, tag = line.split()
              sock = socket.socket(socket.AF_INET6 if ":" in ip else socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(2)
              try:
                  sock.connect((ip, 443))
                  bad.append(f"{tag} {ip}")
              except OSError:
                  pass
              finally:
                  sock.close()
          print("pin still reachable:", bad or "none")
          raise SystemExit(1 if bad else 0)
          EOF
          ip_via() {
            local port="$1" url ip
            for url in https://api.ipify.org https://icanhazip.com https://ifconfig.me/ip; do
              ip=$(curl -m 8 -s -x "socks5h://127.0.0.1:${port}" "$url" || true)
              [ -n "$ip" ] && { echo "$ip"; return 0; }
            done
            echo ""
          }
          internal_chain() {
            docker exec rotate-trial python3 -c "import os,sys; sys.path.insert(0,'/app'); from vpngate_to_singbox import measure_resi_rotate as m; print(m(os.environ.get('VLESS_UUID',''), int(os.environ.get('PORT','3000')), '/ws-chain', count=1, timeout=20))" 2>/dev/null | tail -n 1 || true
          }
          SECRET=$(docker exec rotate-trial python3 -c "import json;print(json.load(open('/app/singbox-railway.json'))['experimental']['clash_api']['secret'])" 2>/dev/null || true)
          selector_now() {
            docker exec rotate-trial curl -s -m 5 -H "Authorization: Bearer $SECRET" \
              http://127.0.0.1:9090/proxies/chain \
              | python3 -c "import json,sys;print('now='+str(json.load(sys.stdin).get('now')))" 2>/dev/null \
              || echo "now=unreachable"
          }
          # Bounded watch. Every sample records the real client path AND both
          # in-container signals, so even a timeout leaves usable evidence.
          DEADLINE=$((SECONDS + 420))
          chain_ip=""
          while [ $SECONDS -lt $DEADLINE ]; do
            chain_ip=$(ip_via 18092)
            [ -n "$chain_ip" ] && { echo "chain alive again after ${SECONDS}s: $chain_ip"; break; }
            echo "  t=${SECONDS}s external=none $(selector_now) internal=$(internal_chain)"
            sleep 6
          done
          [ -n "$chain_ip" ] || {
            echo "chain never came back after the pin died"
            echo "=== chain selector ==="
            docker exec rotate-trial curl -s -H "Authorization: Bearer $SECRET" \
              http://127.0.0.1:9090/proxies/chain || true
            echo
            echo "=== manager view ==="
            curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
              http://127.0.0.1:3000/api/status \
              | python3 -c "import json,sys;s=json.load(sys.stdin);print(s.get('chain_switch'));print('pin',s.get('preferred_tag'));print([h['event'] for h in s.get('refresh_history',[])][-18:])" || true
            echo "=== sing-box stderr tail ==="
            docker exec rotate-trial sh -c 'tail -n 60 /app/singbox-railway.json.stderr.log' 2>/dev/null || true
            docker logs rotate-trial 2>&1 | tail -n 40
            exit 1; }
          # Only the long-lived serving process counts: the manager spawns
          # short-lived `sing-box run` probe clients (endpoint tag dial-probe)
          # whose pids can otherwise be mistaken for the daemon.
          sb_pid() {
            docker exec rotate-trial sh -c 'for p in /proc/[0-9]*/cmdline; do
              c=$(tr "\0" " " < "$p" 2>/dev/null)
              case "$c" in *sing-box*run*/app/singbox-railway.json*) echo "$p" | cut -d/ -f3; break;; esac
            done'
          }
          SB_PID=$(sb_pid); sleep 4; SB_PID2=$(sb_pid)
          CFG_MD5=$(docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1')
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/status -o /tmp/status_postkill.json
          direct=$(cat /tmp/direct_ip.txt)
          echo "pid before=$(cat /tmp/sb_pid_before.txt) after=$SB_PID/$SB_PID2"
          echo "md5 before=$(cat /tmp/cfg_before.txt) after=$CFG_MD5"
          echo "chain exit=$chain_ip direct=$direct"
          python3 - "$SB_PID" "$SB_PID2" "$CFG_MD5" "$chain_ip" "$direct" <<'EOF'
          import json, pathlib, sys
          pid1, pid2, md5, chain_ip, direct = sys.argv[1:6]
          pid0 = pathlib.Path("/tmp/sb_pid_before.txt").read_text().strip()
          md50 = pathlib.Path("/tmp/cfg_before.txt").read_text().strip()
          sw0 = int(pathlib.Path("/tmp/switches_before.txt").read_text().strip())
          pool0 = int(pathlib.Path("/tmp/pool_before.txt").read_text().strip())
          pin0 = pathlib.Path("/tmp/pin_before.txt").read_text().strip()
          s = json.load(open("/tmp/status_postkill.json"))
          print(f"post: pin={s['preferred_tag']} backup={s.get('backup_tag')} "
                f"pool={s['resi']['pool']} switches={s['chain_switch']['switches']}")
          # The hot switch is the whole point: no rewrite, no restart. A config
          # rewrite changes md5; a restart changes the pid and kills every
          # rotation connection with it.
          assert md5 == md50, f"the repin rewrote the config: {md50} -> {md5}"
          assert pid1 == pid0 and pid2 == pid0, f"the repin restarted sing-box: {pid0} -> {pid1}/{pid2}"
          assert int(s["chain_switch"]["switches"]) > sw0, (sw0, s["chain_switch"])
          assert s["preferred_tag"] != pin0, (pin0, s["preferred_tag"])
          assert chain_ip and chain_ip != direct, (chain_ip, direct)
          # The rotation keeps its pool: only one node is reserved, before and after.
          assert int(s["resi"]["pool"]) >= pool0 - 1, (pool0, s["resi"]["pool"])
          assert s["resi"]["reserved"] == 1, s["resi"]
          print("HOT SWITCH OK: chain moved to a live node, same pid, same config, pool intact")
          EOF

      - name: Manual switch is a hot switch too
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          sb_pid() {
            docker exec rotate-trial sh -c 'for p in /proc/[0-9]*/cmdline; do
              c=$(tr "\0" " " < "$p" 2>/dev/null)
              case "$c" in *sing-box*run*/app/singbox-railway.json*) echo "$p" | cut -d/ -f3; break;; esac
            done'
          }
          curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/m.json
          PID0=$(sb_pid)
          MD50=$(docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1')
          TARGET=$(python3 - <<'PY'
          import json
          s = json.load(open('/tmp/m.json'))
          cur = s['preferred_tag']
          for ep in s['endpoints']:
              if ep['tag'] != cur and ep.get('real_latency_ms') is not None:
                  print(ep['tag']); break
          PY
          )
          echo "manual switch -> $TARGET"
          curl -m 15 -s -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            -d "{\"tag\": \"$TARGET\"}" http://127.0.0.1:3000/api/switch -o /tmp/sw.json
          cat /tmp/sw.json
          PID1=$(sb_pid)
          MD51=$(docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1')
          curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/m2.json
          python3 - "$TARGET" "$PID0" "$PID1" "$MD50" "$MD51" <<'EOF'
          import json, sys
          target, pid0, pid1, md50, md51 = sys.argv[1:6]
          s = json.load(open("/tmp/m2.json"))
          print(f"after manual switch: pin={s['preferred_tag']} pid={pid1} md5={md51}")
          assert s["preferred_tag"] == target, (target, s["preferred_tag"])
          assert md51 == md50, "the manual switch rewrote the config"
          assert pid1 == pid0, "the manual switch restarted sing-box"
          print("MANUAL HOT SWITCH OK")
          EOF
      - name: The other two paths must still work
        run: |
          ip_via() {
            local port="$1" url ip
            for url in https://api.ipify.org https://icanhazip.com https://ifconfig.me/ip; do
              ip=$(curl -m 25 -s -x "socks5h://127.0.0.1:${port}" "$url" || true)
              [ -n "$ip" ] && { echo "$ip"; return 0; }
            done
            echo ""
          }
          get_ip() {
            local port="$1"
            for i in $(seq 1 8); do
              ip=$(ip_via "$port")
              [ -n "$ip" ] && { echo "$ip"; return 0; }
              sleep 6
            done
            echo ""
          }
          node=$(get_ip 18091)
          chain=$(get_ip 18092)
          direct=$(cat /tmp/direct_ip.txt)
          echo "/ws-node exit=$node (runner $direct)"
          echo "/ws-chain exit=$chain"
          [ "$node" = "$direct" ] || { echo "/ws-node broke"; exit 1; }
          [ -n "$chain" ] && [ "$chain" != "$direct" ] || { echo "/ws-chain broke"; exit 1; }
          : > /tmp/resi-after.txt
          for i in $(seq 1 8); do
            ip=$(ip_via 18093)
            [ -n "$ip" ] && echo "$ip" >> /tmp/resi-after.txt
            sleep 2
          done
          distinct=$(sort -u /tmp/resi-after.txt | wc -l)
          echo "resi after distinct=$distinct"
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/status -o /tmp/status_final.json
          python3 - "$distinct" <<'EOF'
          import json, sys
          r = json.load(open("/tmp/status_final.json"))["resi"]
          print(f"resi after: pool={r['pool']} down={r.get('down')} mode={r['mode']}")
          # The rotation must still have a pool and still be in rotate mode; the
          # exit-IP sampling is advisory because the quick tunnel flakes.
          assert r["mode"] == "rotate", r
          assert int(sys.argv[1]) >= 1 or r["pool"] >= 1, (sys.argv[1], r)
          print("NO COLLATERAL: /ws-node still direct, /ws-chain exits, rotation intact")
          EOF

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "=== container log tail ==="
          docker logs rotate-trial 2>&1 | tail -n 200 || true
          echo "=== sing-box log ==="
          docker exec rotate-trial sh -c 'tail -n 120 /tmp/singbox-*.log 2>/dev/null' || true
          echo "=== status ==="
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" \
            http://127.0.0.1:3000/api/status | head -c 4000 || true

      - name: Cleanup
        if: always()
        run: |
          pkill -f "cloudflared tunnel" || true
          pkill -f "client-ws" || true
          pkill -f "sing-box" || true
          docker rm -f rotate-trial || true
