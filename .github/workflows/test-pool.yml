name: Rotate pool growth deployment test

# Temporary cloud acceptance test: proves the rotation pool grows from the
# REAL_TOPK startup batch to every node that really dials, because the
# post-refresh full pass now runs automatically in the background.
# Delete this file once verified.

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIMIT: "40"
  REAL_TOPK: "5"
  ADMIN_TOKEN: pool-admin-token-0123456789
  TEST_UUID: a29738e5-bee1-c0fc-b484-ae7c49cbc828

jobs:
  pool-growth:
    name: Pool grows beyond REAL_TOPK (real dials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: pool-railway:trial
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container (small REAL_TOPK, full snapshot)
        run: |
          docker run -d --name pool-trial \
            -p 3000:3000 -p 8084:8084 \
            -e PORT=3000 \
            -e PROXY_USER=u -e PROXY_PASS=0123456789abcdef \
            -e ADMIN_TOKEN="$ADMIN_TOKEN" \
            -e VLESS_UUID="$TEST_UUID" \
            -e LIMIT="$LIMIT" -e REAL_TOPK="$REAL_TOPK" \
            -e DIAL_WORKERS=5 -e FULL_PROBE_WORKERS=5 -e PROBE_WORKERS=30 \
            -e DIAL_TIMEOUT=12 \
            pool-railway:trial
          for i in $(seq 1 40); do
            if curl -m 5 -s http://127.0.0.1:3000/healthz | grep -q "^ok$"; then
              echo "healthz OK after ~$((i * 10))s"
              break
            fi
            sleep 10
          done
          curl -m 10 -s http://127.0.0.1:3000/healthz | grep -q "^ok$" || {
            echo "healthz never OK; container log tail:"
            docker logs pool-trial 2>&1 | tail -n 40
            exit 1
          }

      - name: Capture the startup pool (REAL_TOPK batch)
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status-start.json
          python3 - <<'EOF'
          import json, os
          s = json.load(open("/tmp/status-start.json"))
          r = s["resi"]
          verified = [e for e in s["endpoints"] if e.get("real_latency_ms") is not None]
          print(f"startup: serving={len(s['endpoints'])} verified={len(verified)} "
                f"rotate pool={r['nodes']} full_probe={s['full_probe']['state']}")
          with open("/tmp/pool-start.txt", "w") as fh:
              fh.write(str(r["nodes"]))
          topk = int(os.environ["REAL_TOPK"])
          assert r["mode"] == "rotate", r
          assert r["nodes"] == len(verified), (r["nodes"], len(verified))
          assert r["nodes"] <= topk + 1, f"startup pool {r['nodes']} should be the REAL_TOPK batch"
          print(f"startup pool OK: {r['nodes']} <= REAL_TOPK+1 ({topk + 1})")
          EOF

      - name: Full dial pass runs by itself in the background
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          for i in $(seq 1 150); do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status-run.json
            if python3 -c "import json;exit(0 if json.load(open('/tmp/status-run.json'))['full_probe']['state']=='done' else 1)"; then
              echo "auto full probe finished after ~$((i * 5))s"
              break
            fi
            sleep 5
          done
          python3 - <<'EOF'
          import json, pathlib
          s = json.load(open("/tmp/status-run.json"))
          fp = s["full_probe"]
          print("full_probe:", json.dumps({k: fp.get(k) for k in ("state", "done", "total")}))
          start = int(pathlib.Path("/tmp/pool-start.txt").read_text())
          print(f"pool at startup: {start}")
          events = [h.get("event") for h in (s.get("refresh_history") or [])][-8:]
          print("history tail:", events)
          assert fp["state"] == "done", f"auto full probe never finished: {fp}"
          assert fp["done"] == fp["total"] and fp["total"] > 0, fp
          assert any("full-probe" in str(e) for e in events), events
          EOF

      - name: Pool grew to every verified node
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          # The pass rewrites the serving config; give the manager a moment to
          # republish before judging the pool.
          for i in $(seq 1 60); do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status-end.json
            if python3 -c "import json;exit(0 if json.load(open('/tmp/status-end.json'))['resi']['nodes']>int(open('/tmp/pool-start.txt').read()) else 1)"; then
              break
            fi
            sleep 5
          done
          python3 - <<'EOF'
          import json, pathlib
          s = json.load(open("/tmp/status-end.json"))
          r = s["resi"]
          verified = [e for e in s["endpoints"] if e.get("real_latency_ms") is not None]
          start = int(pathlib.Path("/tmp/pool-start.txt").read_text())
          measured = sorted(e["real_latency_ms"] for e in verified)
          print(f"serving={len(s['endpoints'])} verified={len(verified)} "
                f"rotate pool={r['nodes']} (was {start})")
          print(f"measured latencies (ms): {measured}")
          assert r["nodes"] > start, f"pool did not grow past the REAL_TOPK batch ({start})"
          assert r["nodes"] == len(verified), (r["nodes"], len(verified))
          assert r["nodes"] >= 10, f"pool only reached {r['nodes']} of {len(s['endpoints'])} serving nodes"
          print(f"POOL OK: rotation pool {start} -> {r['nodes']} of {len(s['endpoints'])} serving nodes")
          EOF
          docker exec pool-trial sh -c 'sing-box check -c /app/singbox-railway.json' \
            && echo "grown serving config passes sing-box check"
          docker exec pool-trial cat /app/singbox-railway.json > /tmp/serving.json
          python3 - <<'EOF'
          import json
          cfg = json.load(open("/tmp/serving.json"))
          rot = [i for i in cfg["inbounds"] if i["tag"].startswith("resi-rot-")]
          ports = sorted(i["listen_port"] for i in rot)
          assert ports == list(range(41000, 41000 + len(rot))), ports
          print(f"serving config: {len(rot)} rotate inbounds {ports[0]}..{ports[-1]}")
          EOF

      - name: Rotation still works over the grown pool
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          curl -m 10 -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"count":5}' \
            http://127.0.0.1:3000/api/resi_probe | tee /tmp/probe.json
          for i in $(seq 1 60); do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status-probe.json
            if python3 -c "import json;exit(0 if json.load(open('/tmp/status-probe.json'))['resi']['last_probe']['state']!='running' else 1)"; then
              break
            fi
            sleep 5
          done
          python3 - <<'EOF'
          import json
          p = json.load(open("/tmp/status-probe.json"))["resi"]["last_probe"]
          print("last_probe:", json.dumps(p, ensure_ascii=False))
          assert p["state"] == "done", p
          assert p["rotating"] is True, p
          assert p["distinct"] >= 2, p
          print(f"ROTATION OK over the grown pool: {p['distinct']} distinct exits {p['ips']}")
          EOF

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "=== container log tail ==="
          docker logs --tail 200 pool-trial 2>&1 || true
          for f in /tmp/status-start.json /tmp/status-end.json /tmp/status-probe.json; do
            echo "=== $f ==="
            python3 -m json.tool "$f" 2>/dev/null | head -n 80 || true
          done

      - name: Cleanup
        if: always()
        run: docker rm -f pool-trial || true
