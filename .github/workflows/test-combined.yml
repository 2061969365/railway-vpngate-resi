name: Test combined

# Go sidecar tests only: the Python suite is already covered by
# unit-tests.yml (interpreter/repeat matrix). Keep this workflow cheap.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27"
      - name: Run Go tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...
