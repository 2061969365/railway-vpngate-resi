name: Chain hot-switch diagnosis

# Temporary, short-loop diagnosis for docs/rotate-design.md §12.9g (D15).
# Skips the three-path baseline on purpose: one run boots a container, kills
# the pin and samples the chain from inside the container next to the Clash
# API state, so each iteration costs ~10 minutes instead of ~30.
# Delete this file once verified.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: chain-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain-diag:
    name: Why does the chain not follow its selector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LIMIT: 16
      REAL_TOPK: 10
      ADMIN_TOKEN: rotate-admin-token-0123456789
      TEST_UUID: a29738e5-bee1-c0fc-b484-ae7c49cbc828
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: rotate-trial:trial
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name rotate-trial \
            --cap-add=NET_ADMIN \
            -p 3000:3000 \
            -e PORT=3000 \
            -e PROXY_USER=u -e PROXY_PASS=0123456789abcdef \
            -e ADMIN_TOKEN="$ADMIN_TOKEN" \
            -e VLESS_UUID="$TEST_UUID" \
            -e LIMIT="$LIMIT" -e REAL_TOPK="$REAL_TOPK" \
            -e DIAL_WORKERS=5 -e FULL_PROBE_WORKERS=5 -e PROBE_WORKERS=30 \
            -e DIAL_TIMEOUT=8 \
            rotate-trial:trial
          for i in $(seq 1 40); do
            if curl -m 5 -s http://127.0.0.1:3000/healthz | grep -q "^ok$"; then
              echo "healthz OK after ~$((i * 10))s"
              break
            fi
            sleep 10
          done
          curl -m 10 -s http://127.0.0.1:3000/healthz | grep -q "^ok$" || {
            docker logs rotate-trial 2>&1 | tail -n 60; exit 1; }

      - name: Install the in-container diagnostic
        run: |
          cat > /tmp/diag.py <<'PY'
          import json, sys
          sys.path.insert(0, "/app")

          SECRET = json.load(open("/app/singbox-railway.json"))["experimental"]["clash_api"]["secret"]
          PORT = 3000
          UUID = __import__("os").environ.get("VLESS_UUID", "")


          def clash(path):
              import urllib.request
              req = urllib.request.Request("http://127.0.0.1:9090" + path,
                                           headers={"Authorization": "Bearer " + SECRET})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())


          def selector():
              try:
                  now = clash("/proxies/chain").get("now")
              except Exception as exc:          # noqa: BLE001 - diagnostic only
                  print("now=%s delay=-" % type(exc).__name__)
                  return
              try:
                  delay = clash("/proxies/" + str(now) + "/delay?url=http%3A%2F%2Fcp.cloudflare.com%2Fgenerate_204&timeout=7000").get("delay")
              except Exception as exc:          # noqa: BLE001 - diagnostic only
                  delay = type(exc).__name__
              print("now=%s delay=%s" % (now, delay))


          def probe(path):
              from vpngate_to_singbox import measure_resi_rotate
              got = measure_resi_rotate(UUID, PORT, path, count=1, timeout=15)
              if not got:
                  print("FAIL")
                  return
              print("ips=%s" % ",".join(got["ips"]))


          if __name__ == "__main__":
              {"selector": selector,
               "chain": lambda: probe("/ws-chain"),
               "node": lambda: probe("/ws-node"),
               "resi": lambda: probe("/ws-resi")}[sys.argv[1]]()
          PY
          docker cp /tmp/diag.py rotate-trial:/tmp/diag.py
          docker exec rotate-trial python3 /tmp/diag.py selector || true

      - name: Wait for a pinned chain
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          for i in $(seq 1 120); do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status.json
            if python3 -c "import json;s=json.load(open('/tmp/status.json'));exit(0 if s.get('preferred_tag') and s['resi']['pool']>=3 else 1)"; then
              break
            fi
            sleep 5
          done
          python3 - <<'EOF'
          import json
          s = json.load(open("/tmp/status.json"))
          r = s["resi"]
          print(f"pin={s.get('preferred_tag')} pool={r['pool']} reserved={r.get('reserved')} "
                f"serving={len(s['endpoints'])} switch={s.get('chain_switch')}")
          assert s.get("preferred_tag"), s
          assert r["mode"] == "rotate" and r["pool"] >= 3, r
          assert s["chain_switch"]["mode"] == "clash", s["chain_switch"]
          assert r["reserved"] == 1, r
          print("READY")
          EOF
          docker exec rotate-trial cat /app/singbox-railway.json > /tmp/cfg.json
          python3 - <<'EOF'
          import json
          cfg = json.load(open("/tmp/cfg.json"))
          chain = next(o for o in cfg["outbounds"] if o["tag"] == "chain")
          api = cfg["experimental"]["clash_api"]
          serving = {ep["tag"] for ep in cfg["endpoints"]}
          print("chain:", chain["type"], len(chain["outbounds"]), "default:", chain["default"],
                "interrupt:", chain["interrupt_exist_connections"], "api:", api["external_controller"])
          assert chain["type"] == "selector" and chain["interrupt_exist_connections"] is False
          assert set(chain["outbounds"]) == serving, (chain["outbounds"], serving)
          assert api["external_controller"].startswith("127.0.0.1:")
          print("CHAIN GROUP OK")
          EOF

      - name: Control probe (before the kill)
        run: |
          echo "selector: $(docker exec rotate-trial python3 /tmp/diag.py selector)"
          echo "chain : $(docker exec rotate-trial python3 /tmp/diag.py chain)"
          echo "node  : $(docker exec rotate-trial python3 /tmp/diag.py node)"
          echo "resi  : $(docker exec rotate-trial python3 /tmp/diag.py resi)"

      - name: Kill the pin twice (hot switch must repeat)
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          docker exec -u 0 rotate-trial sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends iptables" >/tmp/apt.log 2>&1 || {
            tail -n 30 /tmp/apt.log; exit 1; }
          sb_pid() {
            docker exec rotate-trial sh -c 'for p in /proc/[0-9]*/cmdline; do
              c=$(tr "\0" " " < "$p" 2>/dev/null)
              case "$c" in *sing-box*run*/app/singbox-railway.json*) echo "$p" | cut -d/ -f3; break;; esac
            done'
          }
          cfg_md5() { docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1'; }
          round=0
          for round in 1 2; do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/pre.json
            PIN=$(python3 -c "import json;print(json.load(open('/tmp/pre.json'))['preferred_tag'])")
            SW0=$(python3 -c "import json;print(json.load(open('/tmp/pre.json'))['chain_switch']['switches'])")
            docker exec rotate-trial cat /app/singbox-railway.json > /tmp/cfg.json
            python3 - "$PIN" "$round" <<'EOF'
          import json, socket, sys
          pin, rnd = sys.argv[1], sys.argv[2]
          cfg = json.load(open("/tmp/cfg.json"))
          ep = next(e for e in cfg["endpoints"] if e["tag"] == pin)
          addrs = [ep["server"]] + [x["server"] for x in (ep.get("servers") or []) if x.get("server")]
          ips = sorted({i[4][0] for a in addrs for i in socket.getaddrinfo(a, None)})
          open(f"/tmp/pin_ips_{rnd}.txt", "w").write("\n".join(ips) + "\n")
          print(f"round {rnd}: pin {pin}: {ips}")
          EOF
            while read -r ip; do
              docker exec -u 0 rotate-trial sh -c "iptables -A OUTPUT -p tcp -d $ip -j REJECT --reject-with tcp-reset; iptables -A OUTPUT -p udp -d $ip -j REJECT" || true
            done < /tmp/pin_ips_$round.txt
            PID0=$(sb_pid); MD50=$(cfg_md5)
            echo "round $round before: pin=$PIN switches=$SW0 pid=$PID0 md5=$MD50"
            DEADLINE=$((SECONDS + 240))
            chain=""
            while [ $SECONDS -lt $DEADLINE ]; do
              sel=$(docker exec rotate-trial python3 /tmp/diag.py selector)
              chain=$(docker exec rotate-trial python3 /tmp/diag.py chain)
              node=$(docker exec rotate-trial python3 /tmp/diag.py node)
              echo "round $round t=${SECONDS}s $sel chain=$chain node=$node"
              case "$chain" in ips=*) break;; esac
              sleep 8
            done
            PID1=$(sb_pid); MD51=$(cfg_md5)
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/post.json
            python3 - "$PIN" "$SW0" "$PID0" "$PID1" "$MD50" "$MD51" "$round" "$chain" <<'EOF'
          import json, sys
          pin0, sw0, pid0, pid1, md50, md51, rnd, chain = sys.argv[1:9]
          s = json.load(open("/tmp/post.json"))
          print(f"round {rnd} after: pin={s['preferred_tag']} switches={s['chain_switch']['switches']} "
                f"pid={pid1} md5={md51} pool={s['resi']['pool']}")
          print(f"round {rnd} events:", [h["event"] for h in s.get("refresh_history", [])][-10:])
          print(f"round {rnd} md5_changed={md51 != md50} pid_changed={pid1 != pid0} "
                f"switches_delta={int(s['chain_switch']['switches']) - int(sw0)}")
          if not chain.startswith("ips="):
              print("ROUND FAILED: chain never carried traffic again"); raise SystemExit(3)
          if md51 != md50:
              print("ROUND FAILED: the repin rewrote the config"); raise SystemExit(4)
          if int(s["chain_switch"]["switches"]) <= int(sw0):
              print("ROUND FAILED: no hot switch was recorded"); raise SystemExit(5)
          print(f"ROUND {rnd} OK: chain came back through a hot switch")
          EOF
            sleep 10
          done

      - name: Dump what sing-box says about the selected endpoint
        if: always()
        run: |
          echo "=== selector ==="; docker exec rotate-trial python3 /tmp/diag.py selector || true
          echo "=== chosen tag log lines ==="
          NOW=$(docker exec rotate-trial python3 /tmp/diag.py selector | sed 's/now=\([^ ]*\).*/\1/')
          docker exec rotate-trial sh -c "grep -a 'endpoint/openvpn-client\[$NOW\]' /app/singbox-railway.json.stderr.log | tail -n 25" || true
          echo "=== not ready / terminated ==="
          docker exec rotate-trial sh -c "grep -aE 'not ready yet|client terminated|client started' /app/singbox-railway.json.stderr.log | tail -n 25" || true
          echo "=== route rules ==="
          docker exec rotate-trial python3 -c "import json;c=json.load(open('/app/singbox-railway.json'));print(json.dumps(c['route'],indent=1)[:1200])"
          echo "=== restart / rewrite causes ==="
          docker logs --since 15m rotate-trial 2>&1 | grep -aE "restart|exited|supervis|config rewritten|rescue" | tail -n 25 || true
          echo "=== manager events ==="
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" http://127.0.0.1:3000/api/status | python3 -c "import json,sys;s=json.load(sys.stdin);print([h['event'] for h in s.get('refresh_history',[])][-20:])" || true

      - name: Cleanup
        if: always()
        run: docker rm -f rotate-trial || true
