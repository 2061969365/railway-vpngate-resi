name: Chain acceptance (rotate cold start + self-heal)

# Permanent cloud regression guard for the rotate-mode chain.
#
# It proves two things on a real container (real sing-box, real VPNGate
# nodes, real traffic), both of which the unit tests cannot show:
#
#   1. COLD START, no manual intervention: the chain must pin itself to a
#      node and carry a real exit IP through /ws-chain. The pin must be
#      adopted WITHOUT a verify-by-dial: verify_fn dials the candidate with
#      a throwaway sing-box client, i.e. a SECOND VPNGate session, and
#      duplicate-cn kicks the session the rotation is serving right now
#      (46c5953, docs/rotate-design.md §12.15).
#      Evidence, all of it observable:
#        * /api/status: resi.mode == rotate, preferred_tag set, auto_pinned
#        * /api/status: backup_tag is None - the rotate pin is `best` alone
#        * refresh_history: the pin event is `auto-pin-unverified`, never
#          `auto-pin` (the verify-by-dial signature)
#        * Clash API /proxies/chain: `now` is the pinned tag
#        * /ws-chain: a real exit IP, different from the container's own IP
#        * the container log: no "verify failed for ..." line (that string
#          is printed by measure_exit_ip, i.e. by a verify-by-dial)
#        * a process watcher inside the container: no client dialed a
#          VPNGate node while the pin was decided (a client that only rides
#          our own loopback opens no VPNGate session and is the healthy
#          shape - see 2983573)
#   2. SELF-HEAL: killing the pin must move the chain through the Clash API
#      (a hot switch) within 120s, with no config rewrite and no sing-box
#      restart, and the chain must carry traffic again. This is what caught
#      the serving endpoints turning into corpses: the manager's own real
#      dials opened a second VPNGate session and the serving side never
#      retried (see 2983573 and 65db989).
#
# workflow_dispatch only: one run costs 25-45 minutes of real VPNGate
# traffic, so a push must never trigger it.

on:
  workflow_dispatch:

concurrency:
  group: chain-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIMIT: "16"
  REAL_TOPK: "10"
  ADMIN_TOKEN: rotate-admin-token-0123456789
  TEST_UUID: a29738e5-bee1-c0fc-b484-ae7c49cbc828

jobs:
  chain-acceptance:
    name: Rotate cold start pins without dialing, and the chain heals itself
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: rotate-trial:trial
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name rotate-trial \
            --cap-add=NET_ADMIN \
            -p 3000:3000 \
            -e PORT=3000 \
            -e PROXY_USER=u -e PROXY_PASS=0123456789abcdef \
            -e ADMIN_TOKEN="$ADMIN_TOKEN" \
            -e VLESS_UUID="$TEST_UUID" \
            -e LIMIT="$LIMIT" -e REAL_TOPK="$REAL_TOPK" \
            -e DIAL_WORKERS=5 -e FULL_PROBE_WORKERS=5 -e PROBE_WORKERS=30 \
            -e DIAL_TIMEOUT=8 \
            rotate-trial:trial
          date +%s > /tmp/t_start.txt
          sleep 2
          docker ps --filter name=rotate-trial --format "{{.Names}} {{.Status}}"

      - name: Install the in-container probes
        run: |
          cat > /tmp/diag.py <<'PY'
          import json, os, sys
          sys.path.insert(0, "/app")

          SECRET = json.load(open("/app/singbox-railway.json"))["experimental"]["clash_api"]["secret"]
          PORT = 3000
          UUID = os.environ.get("VLESS_UUID", "")


          def clash(path):
              import urllib.request
              req = urllib.request.Request("http://127.0.0.1:9090" + path,
                                           headers={"Authorization": "Bearer " + SECRET})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  return json.loads(resp.read().decode())


          def selector():
              try:
                  now = clash("/proxies/chain").get("now")
              except Exception as exc:          # noqa: BLE001 - diagnostic only
                  print("now=%s delay=-" % type(exc).__name__)
                  return
              try:
                  delay = clash("/proxies/" + str(now) + "/delay?url=http%3A%2F%2Fcp.cloudflare.com%2Fgenerate_204&timeout=7000").get("delay")
              except Exception as exc:          # noqa: BLE001 - diagnostic only
                  delay = type(exc).__name__
              print("now=%s delay=%s" % (now, delay))


          def probe(path):
              from vpngate_to_singbox import measure_resi_rotate
              got = measure_resi_rotate(UUID, PORT, path, count=1, timeout=15)
              if not got:
                  print("FAIL")
                  return
              print("ips=%s" % ",".join(got["ips"]))


          def probe_fast(path):
              # Same probe, shorter budget: the cold-start baseline polls it
              # every few seconds, so a long timeout would blur the number.
              from vpngate_to_singbox import measure_resi_rotate
              got = measure_resi_rotate(UUID, PORT, path, count=1, timeout=12)
              if not got:
                  print("FAIL")
                  return
              print("ips=%s" % ",".join(got["ips"]))


          if __name__ == "__main__":
              {"selector": selector,
               "clash": lambda: print(json.dumps(clash("/proxies/chain"))),
               "chain": lambda: probe("/ws-chain"),
               "chainfast": lambda: probe_fast("/ws-chain"),
               "node": lambda: probe("/ws-node"),
               "resi": lambda: probe("/ws-resi")}[sys.argv[1]]()
          PY
          cat > /tmp/watch.py <<'PY'
          """Record every throwaway sing-box client that dials a VPNGate node.

          A verify-by-dial (measure_exit_ip) starts a second sing-box client
          against one VPNGate node: that is the "服务中验证直拨" the rotate
          cold start must not do any more. The serving instance runs
          `sing-box run -c /app/singbox-railway.json`; every OTHER sing-box
          client is a throwaway one, and its config names the node it dials.
          """
          import json, os, re, time, urllib.request

          TOKEN = os.environ.get("ADMIN_TOKEN", "")
          SERVING = "/app/singbox-railway.json"
          LOG = SERVING + ".stderr.log"
          OUT = "/tmp/dial_events.jsonl"
          MARK = "/tmp/watch_markers.json"
          DEADLINE = time.time() + 3600
          HZ = os.sysconf("SC_CLK_TCK")

          def status():
              req = urllib.request.Request("http://127.0.0.1:3000/api/status",
                                           headers={"Authorization": "Bearer " + TOKEN})
              with urllib.request.urlopen(req, timeout=5) as resp:
                  return json.loads(resp.read().decode())

          def clients():
              found = []
              for name in os.listdir("/proc"):
                  if not name.isdigit():
                      continue
                  try:
                      with open("/proc/%s/cmdline" % name, "rb") as fh:
                          raw = fh.read()
                  except OSError:
                      continue
                  parts = [p.decode("utf-8", "replace") for p in raw.split(b"\0") if p]
                  if not parts or "sing-box" not in os.path.basename(parts[0]):
                      continue
                  # `sing-box check -c ...` only validates a config, it opens no
                  # session: only a `run` can hold a VPNGate session.
                  if len(parts) < 2 or parts[1] != "run":
                      continue
                  cfg = None
                  for i, arg in enumerate(parts):
                      if arg == "-c" and i + 1 < len(parts):
                          cfg = parts[i + 1]
                  if not cfg or os.path.realpath(cfg) == os.path.realpath(SERVING):
                      continue
                  found.append((name, cfg))
              return found

          def vpngate_targets(cfg_path):
              try:
                  with open(cfg_path, encoding="utf-8") as fh:
                      cfg = json.load(fh)
              except (OSError, ValueError):
                  return []
              out = []
              for ep in cfg.get("endpoints") or []:
                  if ep.get("type") != "openvpn-client":
                      continue
                  if ep.get("server"):
                      out.append([ep.get("server"), ep.get("server_port"), ep.get("tag")])
                  for item in ep.get("servers") or []:
                      if isinstance(item, dict) and item.get("server"):
                          out.append([item.get("server"), item.get("server_port"), ep.get("tag")])
              return out

          def loopback_targets(cfg_path):
              """The loopback clients (a VLESS client against our own port).

              The rotate full probe measures a node through that node's own
              serving inbound, so its client never opens a VPNGate session.
              """
              try:
                  with open(cfg_path, encoding="utf-8") as fh:
                      cfg = json.load(fh)
              except (OSError, ValueError):
                  return []
              out = []
              for ob in cfg.get("outbounds") or []:
                  if ob.get("type") in ("vless", "vmess", "trojan", "shadowsocks"):
                      if ob.get("server"):
                          out.append([ob.get("server"), ob.get("server_port"), ob.get("tag")])
              return out

          def serving_map():
              try:
                  with open(SERVING, encoding="utf-8") as fh:
                      cfg = json.load(fh)
              except (OSError, ValueError):
                  return {}
              out = {}
              for ep in cfg.get("endpoints") or []:
                  if ep.get("server"):
                      out[ep["server"]] = ep.get("tag")
                  for item in ep.get("servers") or []:
                      if isinstance(item, dict) and item.get("server"):
                          out[item["server"]] = ep.get("tag")
              return out

          def proc_started(pid):
              """Exact start time of a process (epoch seconds), not the poll time."""
              try:
                  with open("/proc/uptime", "r", encoding="utf-8") as fh:
                      up = float(fh.read().split()[0])
                  with open("/proc/%s/stat" % pid, "rb") as fh:
                      data = fh.read()
              except (OSError, ValueError):
                  return None
              tail = data[data.rfind(b")") + 2:].split()
              try:
                  ticks = int(tail[19])      # field 22 (starttime) after field 3
              except (IndexError, ValueError):
                  return None
              return time.time() - up + ticks / HZ

          def log_stats():
              """(count, tags) of the duplicate-cn signature in the serving log.

              `client terminated: authentication failed: terminal` is what the
              serving sing-box prints when its openvpn session is kicked by a
              second session on the same VPNGate node.
              """
              count = 0
              tags = []
              for path in (LOG, LOG + ".prev"):
                  try:
                      with open(path, "rb") as fh:
                          data = fh.read()
                  except OSError:
                      continue
                  for line in data.split(b"\n"):
                      if b"authentication failed: terminal" in line:
                          count += 1
                          found = re.search(rb"openvpn-client\[([^\]]+)\]", line)
                          tags.append(found.group(1).decode("utf-8", "replace") if found else "?")
              return count, tags

          seen = set()
          verified = {}
          markers = {"dialing_done": None, "pin": None, "pin_tag": None,
                     "auth_fail_at_dialing_done": None, "auth_fail_at_pin": None,
                     "auth_fail_total": 0, "terminated_tags": []}
          with open(OUT, "a", buffering=1) as sink:
              while time.time() < DEADLINE:
                  stamp = time.time()
                  auth_fail, terminated = log_stats()
                  try:
                      st = status()
                  except Exception:
                      st = None
                  if st:
                      fp = st.get("full_probe") or {}
                      total = fp.get("total") or 0
                      done = fp.get("done") or 0
                      if markers["dialing_done"] is None and total > 0 and done >= total:
                          markers["dialing_done"] = stamp
                          markers["auth_fail_at_dialing_done"] = auth_fail
                      if markers["pin"] is None and st.get("preferred_tag"):
                          markers["pin"] = stamp
                          markers["pin_tag"] = st.get("preferred_tag")
                          markers["auth_fail_at_pin"] = auth_fail
                      # The nodes the manager has already really dialed
                      # (real_latency_ms is only set after a real dial). A
                      # throwaway client that dials one of them opens a
                      # SECOND VPNGate session for it - that is exactly what
                      # the rotate cold start must not do.
                      verified = {}
                      for ep in (st.get("endpoints") or []):
                          if ep.get("real_latency_ms") is not None and ep.get("server"):
                              verified[ep["server"]] = ep.get("tag")
                  markers["auth_fail_total"] = auth_fail
                  markers["terminated_tags"] = terminated[-20:]
                  with open(MARK, "w", encoding="utf-8") as fh:
                      json.dump(markers, fh)
                  smap = serving_map()
                  for pid, cfg_path in clients():
                      started = proc_started(pid) or stamp
                      vpngate = vpngate_targets(cfg_path)
                      targets = vpngate or loopback_targets(cfg_path)
                      for target in targets:
                          key = (pid, tuple(target))
                          if key in seen:
                              continue
                          seen.add(key)
                          host = target[0]
                          sink.write(json.dumps({
                              "t": started, "seen": stamp, "pid": pid, "config": cfg_path,
                              "kind": "vpngate" if vpngate else "loopback",
                              "target": target, "serving_tag": smap.get(host),
                              "verified_tag": verified.get(host),
                          }) + "\n")
                  time.sleep(0.5)
          PY
          cat > /tmp/sampler.py <<'PY'
          """Sample the chain every few seconds while the pin is killed.

          Four series, all timestamped:
            state: the Clash selector (now + all) and the TCP state of every
                   connection to a serving node (per node tag)
            delay: the Clash delay test of the chain group, of the node it
                   currently selects, and of one reference node that is never
                   killed - the difference tells "the selector/routing is
                   wrong" from "the node/session is wrong"
            exit:  the /ws-chain exit IP (the chain's real traffic)
            log:   the serving sing-box lines of the node it currently selects
          """
          import json, os, sys, threading, time, urllib.request
          from collections import deque

          REF = sys.argv[1] if len(sys.argv) > 1 else ""
          ROUND = sys.argv[2] if len(sys.argv) > 2 else "0"
          OUT = "/tmp/samples_r%s.jsonl" % ROUND
          STOP = "/tmp/stop_sampler"
          LOG = "/app/singbox-railway.json.stderr.log"
          SERVING = "/app/singbox-railway.json"
          UUID = os.environ.get("VLESS_UUID", "")
          PORT = 3000

          SECRET = json.load(open(SERVING))["experimental"]["clash_api"]["secret"]
          lock = threading.Lock()
          sink = open(OUT, "a", buffering=1)
          current = {"now": None}
          log_lines = {}
          log_offset = 0

          def write(obj):
              with lock:
                  sink.write(json.dumps(obj) + "\n")

          def clash(path):
              req = urllib.request.Request("http://127.0.0.1:9090" + path,
                                           headers={"Authorization": "Bearer " + SECRET})
              with urllib.request.urlopen(req, timeout=12) as resp:
                  return json.loads(resp.read().decode())

          def delay(tag):
              try:
                  got = clash("/proxies/%s/delay?url=http%%3A%%2F%%2Fcp.cloudflare.com%%2Fgenerate_204&timeout=3000" % tag)
                  return got.get("delay")
              except Exception as exc:
                  return "error:%s" % type(exc).__name__

          def node_ports():
              try:
                  with open(SERVING, encoding="utf-8") as fh:
                      cfg = json.load(fh)
              except Exception:
                  return {}
              out = {}
              for ep in cfg.get("endpoints") or []:
                  tag = ep.get("tag")
                  if ep.get("server"):
                      out[(ep["server"], int(ep.get("server_port") or 0))] = tag
                  for item in ep.get("servers") or []:
                      if isinstance(item, dict) and item.get("server"):
                          out[(item["server"], int(item.get("server_port") or 0))] = tag
              return out

          TCP_STATES = {"01": "ESTABLISHED", "02": "SYN_SENT", "03": "SYN_RECV",
                        "04": "FIN_WAIT1", "05": "FIN_WAIT2", "06": "TIME_WAIT",
                        "07": "CLOSE", "08": "CLOSE_WAIT", "09": "LAST_ACK",
                        "0A": "LISTEN", "0B": "CLOSING"}

          def tcp_states():
              try:
                  with open("/proc/net/tcp", encoding="utf-8") as fh:
                      rows = fh.read().splitlines()[1:]
              except OSError:
                  return {}
              ports = node_ports()
              out = {}
              for row in rows:
                  parts = row.split()
                  if len(parts) < 4:
                      continue
                  ip_hex, port_hex = parts[2].split(":")
                  port = int(port_hex, 16)
                  ip = ".".join(str(int(ip_hex[i:i + 2], 16)) for i in (6, 4, 2, 0))
                  tag = ports.get((ip, port))
                  if tag:
                      out.setdefault(tag, []).append(TCP_STATES.get(parts[3], parts[3]))
              return out

          def state_loop():
              while not os.path.exists(STOP):
                  sample = {"kind": "state", "t": time.time()}
                  try:
                      info = clash("/proxies/chain")
                      current["now"] = info.get("now")
                      sample["now"] = current["now"]
                      sample["all"] = info.get("all")
                  except Exception as exc:
                      sample["now"] = None
                      sample["all"] = None
                      sample["error"] = type(exc).__name__
                  sample["tcp"] = tcp_states()
                  write(sample)
                  time.sleep(5)

          def delay_loop():
              while not os.path.exists(STOP):
                  sample = {"kind": "delay", "t": time.time()}
                  sample["chain"] = delay("chain")
                  now = current.get("now")
                  if now:
                      sample["now_tag"] = now
                      sample["now_delay"] = delay(now)
                  if REF:
                      sample["ref"] = REF
                      sample["ref_delay"] = delay(REF)
                  write(sample)
                  time.sleep(3)

          def exit_loop():
              sys.path.insert(0, "/app")
              from vpngate_to_singbox import measure_resi_rotate
              while not os.path.exists(STOP):
                  sample = {"kind": "exit", "t": time.time()}
                  try:
                      got = measure_resi_rotate(UUID, PORT, "/ws-chain", count=1, timeout=10)
                      sample["ips"] = (got or {}).get("ips") or []
                      sample["error"] = None if got else "no ip"
                  except Exception as exc:
                      sample["ips"] = []
                      sample["error"] = "%s: %s" % (type(exc).__name__, exc)
                  write(sample)
                  time.sleep(2)

          def log_loop():
              global log_offset
              while not os.path.exists(STOP):
                  try:
                      with open(LOG, "rb") as fh:
                          fh.seek(log_offset)
                          data = fh.read()
                          log_offset = fh.tell()
                  except OSError:
                      data = b""
                  for line in data.decode("utf-8", "replace").splitlines():
                      if "openvpn-client[" in line:
                          tag = line.split("openvpn-client[")[1].split("]")[0]
                          with lock:
                              log_lines.setdefault(tag, deque(maxlen=8)).append(line[-200:])
                  now = current.get("now")
                  if now:
                      with lock:
                          lines = list(log_lines.get(now, []))
                      if lines:
                          write({"kind": "log", "t": time.time(), "tag": now, "lines": lines[-3:]})
                  time.sleep(5)

          for target in (state_loop, delay_loop, exit_loop, log_loop):
              threading.Thread(target=target, daemon=True).start()
          while not os.path.exists(STOP):
              time.sleep(2)
          PY
          docker cp /tmp/diag.py rotate-trial:/tmp/diag.py
          docker cp /tmp/watch.py rotate-trial:/tmp/watch.py
          docker cp /tmp/sampler.py rotate-trial:/tmp/sampler.py
          docker exec -e ADMIN_TOKEN="$ADMIN_TOKEN" -d rotate-trial python3 /tmp/watch.py
          sleep 2
          docker exec rotate-trial sh -c 'ps -ef | grep -c "[w]atch.py"' || true
          echo "watcher started"

      - name: Cold start - the chain pins itself, without dialing to pin
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          T_START=$(cat /tmp/t_start.txt)
          T_READY=0
          for i in $(seq 1 60); do
            if curl -m 5 -s http://127.0.0.1:3000/healthz | grep -q "^ok$"; then
              T_READY=$(date +%s)
              echo "healthz OK after ~$((i * 5))s (epoch $T_READY)"
              break
            fi
            sleep 5
          done
          [ "$T_READY" != "0" ] || { docker logs rotate-trial 2>&1 | tail -n 60; exit 1; }
          echo "container start epoch $T_START, ready epoch $T_READY"
          # The chain has to exit with a real IP within 90s of the container
          # being ready - this is the operational baseline for a cold start
          # (and it covers "the cold start pinned a node that is already
          # dead": the health loop swaps it out on its own).
          T_FIRST=""
          DEADLINE=$((T_READY + 90))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            OUT=$(docker exec rotate-trial python3 /tmp/diag.py chainfast || true)
            NOW=$(date +%s)
            echo "exit-ip probe t=$((NOW - T_READY))s after ready ($((NOW - T_START))s after start): $OUT"
            case "$OUT" in
              ips=*) T_FIRST=$NOW; break;;
            esac
          done
          if [ -n "$T_FIRST" ]; then
            echo "FIRST EXIT IP: $((T_FIRST - T_READY))s after ready, $((T_FIRST - T_START))s after container start" | tee /tmp/t_first_ip.txt
          else
            echo "FIRST EXIT IP: none within 90s of ready" | tee /tmp/t_first_ip.txt
            echo "FAIL: /ws-chain returned no exit IP within 90s of the container being ready"
            exit 1
          fi
          [ $((T_FIRST - T_READY)) -le 90 ] || { echo "FAIL: the first exit IP took $((T_FIRST - T_READY))s (limit 90s)"; exit 1; }
          # No manual intervention anywhere in this workflow: the pin has to
          # come out of the cold start on its own.
          T_PIN=""
          for i in $(seq 1 240); do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/status.json || true
            if python3 -c "import json;s=json.load(open('/tmp/status.json'));exit(0 if s.get('preferred_tag') else 1)" 2>/dev/null; then
              T_PIN=$(date +%s)
              echo "pin appeared $((T_PIN - T_READY))s after ready ($((T_PIN - T_START))s after start), ~$((i * 5))s of polling"
              break
            fi
            sleep 5
          done
          echo "$T_PIN" > /tmp/t_pin.txt
          [ -n "$T_PIN" ] || { echo "FAIL: the chain never pinned itself"; exit 1; }
          {
            echo "container_start_epoch=$T_START"
            echo "ready_epoch=$T_READY"
            echo "first_exit_ip_epoch=$T_FIRST"
            echo "first_exit_ip_after_ready_s=$((T_FIRST - T_READY))"
            echo "first_exit_ip_after_start_s=$((T_FIRST - T_START))"
            echo "pin_epoch=$T_PIN"
            echo "pin_after_ready_s=$((T_PIN - T_READY))"
            echo "pin_after_start_s=$((T_PIN - T_START))"
          } | tee /tmp/timeline.txt
          python3 - <<'EOF'
          import json
          s = json.load(open("/tmp/status.json"))
          r = s["resi"]
          hist = s.get("refresh_history") or []
          events = [h["event"] for h in hist]
          print("preferred_tag:", s.get("preferred_tag"), "backup_tag:", s.get("backup_tag"),
                "auto_pinned:", s.get("auto_pinned"))
          print("resi:", {k: r.get(k) for k in ("mode", "pool", "inbounds", "down", "reserved", "nodes")})
          print("chain_switch:", s.get("chain_switch"))
          print("full_probe:", s.get("full_probe"))
          print("history:", [(h["event"], h.get("detail")) for h in hist])
          assert r.get("mode") == "rotate", r
          assert s.get("preferred_tag"), s
          assert s.get("auto_pinned") is True, s
          # The rotate pin is `best` alone: a verified standby would mean the
          # pin was chosen by dialing the candidates (verify_fn).
          assert s.get("backup_tag") is None, s
          assert r.get("reserved") == 1, r
          # The pin was adopted without an exit-ip verification.
          assert "auto-pin-unverified" in events, events
          assert "auto-pin" not in events, events
          assert s["chain_switch"]["mode"] == "clash", s["chain_switch"]
          print("COLD START STATUS OK: pin=%s pool=%s" % (s["preferred_tag"], r.get("pool")))
          EOF
          echo "--- Clash selector ---"
          docker exec rotate-trial python3 /tmp/diag.py selector
          # The pin rewrites the config, so sing-box restarts: give the loopback
          # Clash API a moment to come back before asking it anything.
          for i in $(seq 1 20); do
            if docker exec rotate-trial python3 /tmp/diag.py clash > /tmp/clash.json 2>/dev/null && [ -s /tmp/clash.json ]; then
              break
            fi
            echo "clash API not ready yet ($i)"
            sleep 3
          done
          head -c 400 /tmp/clash.json; echo
          python3 - <<'EOF'
          import json
          s = json.load(open("/tmp/status.json"))
          clash = json.load(open("/tmp/clash.json"))
          now = clash.get("now")
          print("clash now:", now, "pin:", s["preferred_tag"])
          assert now == s["preferred_tag"], (now, s["preferred_tag"])
          assert "auto" not in (clash.get("all") or []), clash
          print("CLASH OK: the selector sits on the pinned node")
          EOF
          echo "--- exit IP through /ws-chain ---"
          CHAIN=""
          for i in $(seq 1 10); do
            CHAIN=$(docker exec rotate-trial python3 /tmp/diag.py chain || true)
            echo "attempt $i: $CHAIN"
            case "$CHAIN" in ips=*) break;; esac
            sleep 10
          done
          OWN=$(docker exec rotate-trial sh -c 'curl -s --max-time 15 https://api.ipify.org || true')
          echo "container egress IP: $OWN"
          echo "$CHAIN" > /tmp/chain_ip.txt
          echo "$OWN" > /tmp/own_ip.txt
          python3 - <<'EOF'
          import pathlib
          chain = pathlib.Path("/tmp/chain_ip.txt").read_text().strip()
          own = pathlib.Path("/tmp/own_ip.txt").read_text().strip()
          print("chain:", chain, "container egress:", own)
          assert chain.startswith("ips="), chain
          ips = [ip for ip in chain[len("ips="):].split(",") if ip]
          assert ips, chain
          for ip in ips:
              assert ip.count(".") == 3, ip
              assert ip != own, ("the chain leaked the container's own egress", ip, own)
          print("EXIT IP OK: the chain exits through the VPNGate node")
          EOF
          echo "=== container log: any verify-by-dial? ==="
          docker logs rotate-trial 2>&1 | grep -n "verify" || echo "(no 'verify' line in the container log)"
          if docker logs rotate-trial 2>&1 | grep -q "verify failed for"; then
            echo "FAIL: the cold start ran a verify-by-dial (measure_exit_ip) -"
            echo "      that opens a second VPNGate session and kicks the serving one."
            docker logs rotate-trial 2>&1 | grep -n "verify failed for" | head -n 20
            exit 1
          fi
          echo "no 'verify failed for' line: no verify-by-dial ran"

      - name: Let the pin and sing-box settle before the kill
        run: |
          prev=""
          for i in $(seq 1 60); do
            pid=$(docker exec rotate-trial sh -c 'for p in /proc/[0-9]*/cmdline; do c=$(tr "\0" " " < "$p" 2>/dev/null); case "$c" in *sing-box*run*/app/singbox-railway.json*) echo "$p" | cut -d/ -f3; break;; esac; done')
            md5=$(docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1')
            recent=$(docker logs --since 60s rotate-trial 2>&1 | grep -c "config rewritten" || true)
            cur="$pid/$md5"
            echo "settle $i: pid=$pid md5=$md5 rewrites_in_last_60s=$recent"
            if [ "$cur" = "$prev" ] && [ "$recent" = "0" ]; then
              echo "SETTLED: pin and sing-box are quiet"
              break
            fi
            prev="$cur"
            sleep 10
          done
          [ "$recent" = "0" ] || { echo "config never settled"; exit 1; }

      - name: Kill the pin twice (the chain must hot-switch and heal)
        run: |
          AUTH="Authorization: Bearer $ADMIN_TOKEN"
          docker exec -u 0 rotate-trial sh -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends iptables" >/tmp/apt.log 2>&1 || {
            tail -n 30 /tmp/apt.log; exit 1; }
          sb_pid() {
            # The executable is what identifies the serving instance: matching
            # the cmdline text alone also matches this very shell (its cmdline
            # contains the pattern), which would report a new pid per call.
            docker exec rotate-trial sh -c 'for p in /proc/[0-9]*; do
              pid=${p#/proc/}
              [ -r "$p/cmdline" ] || continue
              exe=$(readlink "$p/exe" 2>/dev/null) || continue
              case "$exe" in */sing-box) ;; *) continue;; esac
              c=$(tr "\0" " " < "$p/cmdline" 2>/dev/null)
              case "$c" in *singbox-railway.json*) case "$c" in */tmp/*) continue;; esac; echo "$pid"; break;; esac
            done'
          }
          cfg_md5() { docker exec rotate-trial sh -c 'md5sum /app/singbox-railway.json | cut -d" " -f1'; }
          for round in 1 2; do
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/pre.json
            PIN=$(python3 -c "import json;print(json.load(open('/tmp/pre.json'))['preferred_tag'])")
            SW0=$(python3 -c "import json;print(json.load(open('/tmp/pre.json'))['chain_switch']['switches'])")
            # A reference node the chain never selects: its delay is the control
            # for "the selector is wrong" vs "the node/session is wrong".
            docker exec rotate-trial python3 /tmp/diag.py clash > /tmp/clash_now.json 2>/dev/null || true
            REF=$(python3 - "$PIN" <<'EOF'
          import json, sys
          pin = sys.argv[1]
          try:
              data = json.load(open("/tmp/clash_now.json"))
          except Exception:
              data = {}
          members = [t for t in (data.get("all") or []) if t and t != pin]
          print(sorted(members)[0] if members else "")
          EOF
            )
            echo "round $round: pin=$PIN reference_node=$REF"
            docker exec rotate-trial rm -f /tmp/stop_sampler
            docker exec -d rotate-trial python3 /tmp/sampler.py "$REF" "$round"
            sleep 3
            docker exec rotate-trial cat /app/singbox-railway.json > /tmp/cfg.json
            python3 - "$PIN" "$round" <<'EOF'
          import json, socket, sys
          pin, rnd = sys.argv[1], sys.argv[2]
          cfg = json.load(open("/tmp/cfg.json"))
          ep = next(e for e in cfg["endpoints"] if e["tag"] == pin)
          # Every remote of the endpoint, with its port. VPNGate serves many
          # nodes from the SAME ip on different ports, so the kill has to be
          # per (ip, port): blocking the whole ip would take the rotation
          # pool down with it.
          remotes = []
          if ep.get("server"):
              remotes.append((ep["server"], int(ep.get("server_port") or 0)))
          for item in (ep.get("servers") or []):
              if isinstance(item, dict) and item.get("server"):
                  remotes.append((item["server"], int(item.get("server_port") or 0)))
          pairs = set()
          for host, port in remotes:
              try:
                  infos = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
              except OSError:
                  infos = [(host, port)]
              for info in infos:
                  ip = info[4][0]
                  if ":" in ip:          # iptables here is IPv4 only
                      continue
                  pairs.add((ip, port))
          with open(f"/tmp/pin_ips_{rnd}.txt", "w", encoding="utf-8") as fh:
              for ip, port in sorted(pairs):
                  fh.write(f"{ip} {port}\n")
          print(f"round {rnd}: pin {pin}: {len(pairs)} address/port pair(s)")
          for ip, port in sorted(pairs):
              print(f"  block {ip}:{port}")
          EOF
            while read -r ip port; do
              [ -n "$ip" ] || continue
              docker exec -u 0 rotate-trial sh -c "iptables -A OUTPUT -p tcp -d $ip --dport $port -j REJECT --reject-with tcp-reset; iptables -A OUTPUT -p udp -d $ip --dport $port -j REJECT" || true
            done < /tmp/pin_ips_$round.txt
            echo "round $round: the iptables rules that are actually in place:"
            docker exec -u 0 rotate-trial iptables -S OUTPUT | tee /tmp/iptables_r$round.txt
            PID0=$(sb_pid); MD50=$(cfg_md5)
            echo "round $round before: pin=$PIN switches=$SW0 pid=$PID0 md5=$MD50"
            DEADLINE=$((SECONDS + 360))
            T0=$SECONDS
            chain=""
            sel=""
            now=""
            while [ $SECONDS -lt $DEADLINE ]; do
              sel=$(docker exec rotate-trial python3 /tmp/diag.py selector || true)
              chain=$(docker exec rotate-trial python3 /tmp/diag.py chain || true)
              now=$(echo "$sel" | sed 's/now=\([^ ]*\).*/\1/')
              PIDNOW=$(sb_pid)
              if [ -n "$PIDNOW" ] && [ "$PIDNOW" != "$PID0" ]; then
                echo "round $round: the serving sing-box changed pid $PID0 -> $PIDNOW"
                curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status | python3 -c "import json,sys;s=json.load(sys.stdin);print('  manager last_error:',s.get('last_error'));print('  history:',[(h['event'],h.get('detail')) for h in s.get('refresh_history',[])][-6:])" || true
              fi
              echo "round $round t=$((SECONDS - T0))s $sel chain=$chain pid=$PIDNOW"
              # The chain is only "healed" when it carries traffic again AND the
              # selector really moved off the killed pin.
              case "$chain" in
                ips=*) if [ -n "$now" ] && [ "$now" != "$PIN" ]; then break; fi;;
              esac
              sleep 5
            done
                        PID1=$(sb_pid); MD51=$(cfg_md5)
            HEAL=$((SECONDS - T0))
            echo "round $round heal_time=${HEAL}s" | tee -a /tmp/heal_times.txt
            # How many serving sing-box instances did the log see? Each one is
            # a restart of the serving stack.
            docker exec rotate-trial sh -c 'cat /app/singbox-railway.json.stderr.log /app/singbox-railway.json.stderr.log.prev 2>/dev/null | grep -ao "\[[0-9]\{4\}\] endpoint/openvpn-client" | sort -u | tr "\n" " "' || true
            echo
            curl -m 10 -s -H "$AUTH" http://127.0.0.1:3000/api/status -o /tmp/post.json
            python3 - "$PIN" "$SW0" "$PID0" "$PID1" "$MD50" "$MD51" "$round" "$chain" "$sel" "$HEAL" <<'EOF'
          import json, pathlib, sys
          pin0, sw0, pid0, pid1, md50, md51, rnd, chain, sel, heal = sys.argv[1:11]
          s = json.load(open("/tmp/post.json"))
          print(f"round {rnd} after: pin={s['preferred_tag']} switches={s['chain_switch']['switches']} "
                f"pid={pid1} md5={md51} pool={s['resi']['pool']} selector={sel} heal={heal}s")
          print(f"round {rnd} last_error: {s.get('last_error')}")
          resi = s.get("resi") or {}
          print(f"round {rnd} resi: mode={resi.get('mode')} pool={resi.get('pool')} "
                f"down={resi.get('down')} nodes={resi.get('nodes')} inbounds={resi.get('inbounds')} "
                f"state={resi.get('state')} error={resi.get('error')}")
          print(f"round {rnd} resi-probe events: "
                + str([h.get('detail') for h in s.get('refresh_history', []) if h.get('event') == 'resi-probe'][-6:]))
          print(f"round {rnd} events:", [(h["event"], h.get("detail")) for h in s.get("refresh_history", [])][-12:])
          print(f"round {rnd} md5_changed={md51 != md50} pid_changed={pid1 != pid0} "
                f"switches_delta={int(s['chain_switch']['switches']) - int(sw0)}")
          problems = []
          if not chain.startswith("ips="):
              problems.append("the chain never carried traffic again")
          if int(heal) > 120:
              problems.append(f"the chain healed only after {heal}s (limit 120s)")
          if md51 != md50:
              problems.append("the repin rewrote the config")
          if pid1 != pid0:
              problems.append("the repin restarted sing-box")
          if int(s["chain_switch"]["switches"]) <= int(sw0):
              problems.append("no hot switch was recorded")
          if s["preferred_tag"] == pin0:
              problems.append("the pin did not move")
          with open("/tmp/round_results.txt", "a", encoding="utf-8") as fh:
              fh.write(f"round {rnd}: " + ("; ".join(problems) if problems else "OK") + "\n")
          if problems:
              print(f"ROUND {rnd} FAILED: " + "; ".join(problems))
          else:
              print(f"ROUND {rnd} OK: the chain came back through a hot switch in {heal}s")
          EOF
            sleep 10
          done
          docker exec rotate-trial touch /tmp/stop_sampler || true
          echo "=== iptables rules in the container ==="
          cat /tmp/iptables_r1.txt /tmp/iptables_r2.txt 2>/dev/null || echo "(none)"
          echo "=== the chain after the kill: did it carry traffic? ==="
          docker exec rotate-trial sh -c 'cat /tmp/samples_r1.jsonl /tmp/samples_r2.jsonl 2>/dev/null' > /tmp/samples.jsonl || true
          wc -l /tmp/samples.jsonl
          python3 - <<'EOF'
          import json, pathlib
          raw = pathlib.Path("/tmp/samples.jsonl").read_text().splitlines()
          samples = [json.loads(l) for l in raw if l.strip()]
          states = [s for s in samples if s.get("kind") == "state"]
          delays = [s for s in samples if s.get("kind") == "delay"]
          exits = [s for s in samples if s.get("kind") == "exit"]
          logs = [s for s in samples if s.get("kind") == "log"]
          print("samples: %d state, %d delay, %d exit, %d log" % (
              len(states), len(delays), len(exits), len(logs)))
          print("--- the selector over time (now / all) ---")
          for s in states:
              tcp = s.get("tcp") or {}
              est = sorted(t for t, v in tcp.items() if "ESTABLISHED" in v)
              print("  t=%.0f now=%s all=%s tcp_established=%s" % (
                  s["t"], s.get("now"), len(s.get("all") or []), ",".join(est)))
          print("--- the delay tests (chain group / current node / reference) ---")
          for s in delays:
              print("  t=%.0f chain=%s now=%s now_delay=%s ref=%s ref_delay=%s" % (
                  s["t"], s.get("chain"), s.get("now_tag"), s.get("now_delay"),
                  s.get("ref"), s.get("ref_delay")))
          print("--- the /ws-chain exit IP ---")
          ok = [s for s in exits if s.get("ips")]
          for s in exits:
              print("  t=%.0f ips=%s error=%s" % (s["t"], s.get("ips"), s.get("error")))
          if ok:
              print("CHAIN AFTER THE KILL: it carried traffic %d time(s), first at t=%.0f" % (
                  len(ok), ok[0]["t"]))
          else:
              print("CHAIN AFTER THE KILL: it NEVER carried traffic (no /ws-chain exit IP in any sample)")
          if delays:
              ref_ok = [s for s in delays if isinstance(s.get("ref_delay"), int)]
              chain_ok = [s for s in delays if isinstance(s.get("chain"), int)]
              print("delay samples: chain ok %d/%d, reference ok %d/%d" % (
                  len(chain_ok), len(delays), len(ref_ok), len(delays)))
          print("--- the serving log lines of the node the chain selects ---")
          for s in logs[-12:]:
              print("  t=%.0f tag=%s" % (s["t"], s.get("tag")))
              for line in s.get("lines") or []:
                  print("      %s" % line)
          EOF
          echo "=== round results ==="; cat /tmp/round_results.txt 2>/dev/null || true
          if grep -q "OK$" /tmp/round_results.txt 2>/dev/null && [ "$(grep -c . /tmp/round_results.txt)" = "$(grep -c "OK$" /tmp/round_results.txt)" ]; then
            echo "ALL ROUNDS OK"
          else
            echo "AT LEAST ONE ROUND FAILED (see above)"
            exit 1
          fi

      - name: No throwaway client dialed an already measured node
        if: always()
        run: |
          docker exec rotate-trial cat /tmp/dial_events.jsonl > /tmp/dial_events.jsonl || true
          docker exec rotate-trial cat /tmp/watch_markers.json > /tmp/watch_markers.json || true
          wc -l /tmp/dial_events.jsonl
          python3 - <<'EOF'
          import json, pathlib
          raw = pathlib.Path("/tmp/dial_events.jsonl").read_text().splitlines()
          events = [json.loads(line) for line in raw if line.strip()]
          markers = json.loads(pathlib.Path("/tmp/watch_markers.json").read_text())
          print("markers:", json.dumps(markers, indent=1))
          vpngate = [e for e in events if e.get("kind") == "vpngate"]
          loopback = [e for e in events if e.get("kind") != "vpngate"]
          print("throwaway sing-box clients: %d total, %d dialing a VPNGate node, %d riding the loopback" % (
              len(events), len(vpngate), len(loopback)))
          for e in events:
              print("  t=%.3f %s pid=%s target=%s serving_tag=%s verified_tag=%s" % (
                  e["t"], e.get("kind"), e["pid"], e.get("target"),
                  e.get("serving_tag"), e.get("verified_tag")))
          assert events, "the watcher saw no throwaway client at all: no evidence"
          pin_t = markers.get("pin")
          assert pin_t, markers
          done_t = markers.get("dialing_done")
          # The pin decision window: the full probe finished -> the pin is set.
          # Everything the full probe itself dialed started before the probe
          # finished, so it is outside the window; only a dial that happens
          # *while the pin is decided* can be a verify-by-dial.
          start = (done_t - 1.0) if done_t is not None else (pin_t - 15.0)
          end = pin_t + 30.0
          inside = [e for e in events if start <= e["t"] <= end]
          print("pin decision window: %.3f .. %.3f" % (start, end))
          print("throwaway clients inside the pin window: %d" % len(inside))
          for e in inside:
              print("  in-window t=%.3f %s target=%s serving_tag=%s verified_tag=%s" % (
                  e["t"], e.get("kind"), e.get("target"),
                  e.get("serving_tag"), e.get("verified_tag")))
          # The invariant: while the pin is decided, no client may dial a
          # VPNGate node. A throwaway client that dials one opens a SECOND
          # VPNGate session for it and kicks the session the serving side
          # holds (duplicate-cn). A client that only rides our own loopback
          # (the rotate probe measures through the node's own serving
          # inbound) opens no session at all - that is the healthy shape.
          violations = [e for e in inside if e.get("kind") == "vpngate"]
          print("clients that dialed a VPNGate node inside the pin window: %d" % len(violations))
          print("throwaway VPNGate dials elsewhere in the run: %d" % len(vpngate))
          for e in vpngate:
              print("  vpngate t=%.3f target=%s serving_tag=%s verified_tag=%s" % (
                  e["t"], e.get("target"), e.get("serving_tag"), e.get("verified_tag")))
          # (2) The duplicate-cn signature itself: the serving sing-box must
          #     not lose a session while the pin is decided. (The same line
          #     shows up outside this window when the full probe legitimately
          #     dials a node the urltest group holds a session on, so the
          #     count is compared across the window, not against zero.)
          a0 = markers.get("auth_fail_at_dialing_done")
          a1 = markers.get("auth_fail_at_pin")
          kicked = None
          if a0 is not None and a1 is not None:
              kicked = a1 - a0
          print("'authentication failed: terminal' in the serving log: total=%s, during the pin decision=%s" % (
              markers.get("auth_fail_total"), kicked))
          print("terminated session tags:", markers.get("terminated_tags"))
          assert not violations, (
              "a throwaway client dialed a VPNGate node while the pin was decided", violations)
          assert kicked in (None, 0), (
              "a serving session was kicked while the pin was decided", kicked,
              markers.get("terminated_tags"))
          print("NO DIAL-TO-PIN OK: the cold start pinned without a verify-by-dial")
          EOF

      - name: Dump the evidence
        if: always()
        run: |
          echo "=== cold start timeline ==="; cat /tmp/timeline.txt 2>/dev/null || echo "(none)"
          echo "=== heal times ==="; cat /tmp/heal_times.txt 2>/dev/null || echo "(none)"
          echo "=== chain exit IP vs container egress ==="
          cat /tmp/chain_ip.txt 2>/dev/null || true; cat /tmp/own_ip.txt 2>/dev/null || true
          echo "=== final status ==="
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" http://127.0.0.1:3000/api/status > /tmp/final.json || true
          python3 - <<'EOF'
          import json, pathlib
          try:
              s = json.load(open("/tmp/final.json"))
          except Exception as exc:
              print("no status:", exc)
          else:
              print("preferred_tag:", s.get("preferred_tag"), "backup_tag:", s.get("backup_tag"))
              print("chain_switch:", s.get("chain_switch"))
              print("resi:", s.get("resi"))
              print("full_probe:", s.get("full_probe"))
              print("history:", [(h["event"], h.get("detail")) for h in s.get("refresh_history", [])][-20:])
          EOF
          echo "=== selector ==="; docker exec rotate-trial python3 /tmp/diag.py selector || true
          echo "=== chosen tag log lines ==="
          NOW=$(docker exec rotate-trial python3 /tmp/diag.py selector 2>/dev/null | sed 's/now=\([^ ]*\).*/\1/' || true)
          docker exec rotate-trial sh -c "grep -a 'endpoint/openvpn-client\[$NOW\]' /app/singbox-railway.json.stderr.log | tail -n 25" || true
          echo "=== duplicate-cn signature in the serving sing-box log ==="
          docker exec rotate-trial sh -c 'cat /app/singbox-railway.json.stderr.log /app/singbox-railway.json.stderr.log.prev 2>/dev/null | grep -ac "authentication failed: terminal"' || echo "(no log)"
          docker exec rotate-trial sh -c 'cat /app/singbox-railway.json.stderr.log /app/singbox-railway.json.stderr.log.prev 2>/dev/null | grep -a "authentication failed: terminal" | tail -n 20' || true
          echo "=== not ready / terminated ==="
          docker exec rotate-trial sh -c "grep -aE 'not ready yet|client terminated|client started' /app/singbox-railway.json.stderr.log | tail -n 25" || true
          echo "=== config rewrites ==="
          docker logs rotate-trial 2>&1 | grep -n "config rewritten" || echo "(no config rewrite)"
          echo "=== chain rescues / pins ==="
          docker logs rotate-trial 2>&1 | grep -aE "chain rescue|auto-pinned|refreshed|full probe done" | tail -n 30 || true
          echo "=== verify-by-dial lines ==="
          docker logs rotate-trial 2>&1 | grep -n "verify" || echo "(no verify line)"
          echo "=== throwaway VPNGate dials ==="
          docker exec rotate-trial cat /tmp/dial_events.jsonl 2>/dev/null | tail -n 40 || true
          echo "=== round results ==="; cat /tmp/round_results.txt 2>/dev/null || echo "(none)"
          echo "=== serving sing-box instances in the log (one per restart) ==="
          docker exec rotate-trial sh -c 'cat /app/singbox-railway.json.stderr.log /app/singbox-railway.json.stderr.log.prev 2>/dev/null | grep -ao "\[[0-9]\{4\}\] endpoint/openvpn-client" | sort -u | tr "\n" " "' || true
          echo
          echo "=== sing-box crash markers ==="
          docker exec rotate-trial sh -c 'cat /app/singbox-railway.json.stderr.log /app/singbox-railway.json.stderr.log.prev 2>/dev/null | grep -aiE "panic|fatal error|runtime error|goroutine [0-9]+ \[" | head -n 20' || echo "(no panic)"
          echo "=== last 40 lines of the serving sing-box log ==="
          docker exec rotate-trial sh -c 'tail -n 40 /app/singbox-railway.json.stderr.log' || true
          echo "=== per-node 'endpoint is not ready yet' in the serving log (dead clients) ==="
          docker exec rotate-trial sh -c 'cat /app/singbox-railway.json.stderr.log /app/singbox-railway.json.stderr.log.prev 2>/dev/null | grep -ao "openvpn-client\[[^]]*\]: endpoint is not ready yet" | sort | uniq -c | sort -rn | head -n 20' || true
          echo "=== manager status: last_error / threads ==="
          curl -m 10 -s -H "Authorization: Bearer $ADMIN_TOKEN" http://127.0.0.1:3000/api/status | python3 -c "import json,sys;s=json.load(sys.stdin);print('last_error:',s.get('last_error'));print('refresh_history:',[(h['event'],h.get('detail')) for h in s.get('refresh_history',[])]);print('memory:',s.get('memory'))" || true
          echo "=== container log (last 60 lines) ==="
          docker logs rotate-trial 2>&1 | tail -n 60
          echo "=== route rules ==="
          docker exec rotate-trial python3 -c "import json;c=json.load(open('/app/singbox-railway.json'));print(json.dumps(c['route'],indent=1)[:1200])"
          echo "=== restart / rewrite causes ==="
          docker logs --since 30m rotate-trial 2>&1 | grep -aE "restart|exited|supervis|config rewritten|rescue" | tail -n 25 || true

      - name: Cleanup
        if: always()
        run: docker rm -f rotate-trial || true
